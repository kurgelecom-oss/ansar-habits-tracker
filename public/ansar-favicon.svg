<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="ansarGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFB81C;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFA500;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="20" fill="url(#ansarGrad)"/>

  <g transform="translate(64, 54)" fill="white">
    <!-- Handles first, cup on top, so the joins are covered and the rim stays crisp.
         Stroke is 8u on a 128u grid = 1px at 16px; anything thinner disappears. Both
         endpoints sit inside the cup silhouette so the handles read as attached. -->
    <path d="M -21 -20 Q -34 -14 -30 -2 Q -26 6 -14 8" fill="none" stroke="white"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 21 -20 Q 34 -14 30 -2 Q 26 6 14 8" fill="none" stroke="white"
          stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Cup: widest at the rim, tapering down. A mid-bulge reads as a bowl, not a trophy. -->
    <path d="M -22 -26 L 22 -26 L 19 2 Q 17 16 0 18 Q -17 16 -19 2 Z"/>

    <!-- Stem overlaps cup bottom (y18) and base top (y34) so there is no seam. -->
    <rect x="-6" y="14" width="12" height="20"/>

    <!-- Base: solid trapezoid, not a detached ellipse. -->
    <path d="M -20 46 L 20 46 L 14 34 L -14 34 Z"/>
  </g>
</svg>
